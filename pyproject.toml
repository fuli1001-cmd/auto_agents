[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-agents"
version = "0.1.0"
description = "Provider-agnostic orchestration for quality-first AI-assisted new project delivery."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "fuli" }
]
dependencies = [
  "regex>=2024.7.24; python_version >= '3.10'",
  "regex>=2024.7.24,<2026.0; python_version < '3.10'",
]

[project.scripts]
auto-agents = "auto_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
